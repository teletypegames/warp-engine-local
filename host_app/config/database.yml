default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 %>
  timeout: 5000

production:
  primary:
    <<: *default
    database: <%= File.join(ENV.fetch("WARP_DATA", "/data"), "warp_engine.sqlite3") %>
  queue:
    <<: *default
    database: <%= File.join(ENV.fetch("WARP_DATA", "/data"), "queue.sqlite3") %>
    migrations_paths: db/queue_migrate

development:
  primary:
    <<: *default
    database: <%= File.join(ENV.fetch("WARP_DATA", "tmp/data"), "warp_engine.sqlite3") %>
  queue:
    <<: *default
    database: <%= File.join(ENV.fetch("WARP_DATA", "tmp/data"), "queue.sqlite3") %>
    migrations_paths: db/queue_migrate
