# WarpEngine Local: the installers are checked on every push and tag. The image is built and pushed
# by hand (bin/push-image); the installers on master pin INSTALLER_VERSION, so bump it with the tag.
when:
  - event: push
    branch: master
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  shellcheck:
    image: koalaman/shellcheck-alpine:v0.10.0
    commands:
      - shellcheck -s sh install.sh bin/push-image

  installer-version:
    image: alpine:3.22
    commands:
      - SH="$(sed -n 's/^INSTALLER_VERSION="\(.*\)"/\1/p' install.sh)"
      - PS="$(sed -n 's/^\$InstallerVersion = "\(.*\)"/\1/p' install.ps1)"
      - test "$SH" = "$PS" || { echo "install.sh $SH and install.ps1 $PS differ"; exit 1; }
      - if [ -n "$CI_COMMIT_TAG" ]; then test "v$SH" = "$CI_COMMIT_TAG" || { echo "tag $CI_COMMIT_TAG, installers $SH"; exit 1; }; fi

  # Every class, module, constant, attribute and method of the host app has an RDoc comment:
  # below 100% the pipeline fails.
  rdoc-coverage:
    image: ruby:3.3
    commands:
      - gem install --no-document rdoc -v 8.1.0
      - cd host_app && rdoc -C app lib | tee ../coverage.txt
      - grep -q '100.00% documented' coverage.txt

  # On a tag, or a manual run of master: the RDoc of the host app as the Gitea generic package
  # engines/warp-engine-local-rdoc/<installer version>, which the wiki-fetcher serves under
  # /rdoc/warp-engine-local/ (services/wiki-pages, fetcher/README.md).
  publish-rdoc:
    image: ruby:3.3
    depends_on: [rdoc-coverage]
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - gem install --no-document rdoc -v 8.1.0
      - V="$(sed -n 's/^INSTALLER_VERSION="\(.*\)"/\1/p' install.sh)"
      - cd host_app && rdoc -q -o ../doc --main ../README.md --title "WarpEngine Local $$V" app lib ../README.md && cd ..
      - |
        ruby -rjson -e 'puts JSON.generate(gem: "warp-engine-local", version: ARGV[0], commit: ARGV[1], date: Time.now.utc.strftime("%F"), coverage: 100.0)' "$$V" "$(git rev-parse HEAD)" > doc/meta.json
      - tar -czf rdoc.tar.gz -C doc .
      - |
        ruby -rnet/http -e '
          uri = URI("https://git.teletypegames.org/api/packages/engines/generic/warp-engine-local-rdoc/#{ARGV[0]}/rdoc.tar.gz")
          req = Net::HTTP::Put.new(uri, "Authorization" => "token #{ENV.fetch("GITEA_TOKEN").strip}", "Content-Type" => "application/octet-stream")
          req.body = File.binread("rdoc.tar.gz")
          res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
          puts "#{res.code} #{uri}"
          exit(res.is_a?(Net::HTTPSuccess) ? 0 : 1)' "$$V"
    when:
      - event: tag
      - event: manual
